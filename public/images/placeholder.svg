<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
  <title>Missing product image</title>
  <desc>Simple placeholder graphic used when a product image fails to load.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5f5" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" />
  <g fill="#1f2937" font-family="'Inter', 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="200" y="150" font-size="36" font-weight="600">Image unavailable</text>
    <text x="200" y="190" font-size="18">Crit Counter</text>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="120" y="70" width="160" height="120" rx="12" />
    <path d="M140 160l32-40 36 28 24-24 28 36" />
  </g>
</svg>